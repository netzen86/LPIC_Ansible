---
- name: Clean internet services
  hosts: serverb.lab.example.com
  become: true
  tasks:
   - name: Present firewalld, httpd, mariadb-server, php, php-mysqlnd version uninstalled
     ansible.builtin.dnf:
      name: [firewalld, httpd, mariadb-server, php, php-mysqlnd]
      state: absent
   - name: Remove HTTPD files
     ansible.builtin.file:
      path: /var/www/
      state: absent
