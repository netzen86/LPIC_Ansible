---
- name: Enable internet services
  hosts: serverb.lab.example.com
  become: true
  tasks:
   - name: Present firewalld version installed
     ansible.builtin.dnf:
      name: firewalld
      state: present
   - name: Present httpd version installed
     ansible.builtin.dnf:
      name: httpd
      state: present
   - name: Present mariadb-server version installed
     ansible.builtin.dnf:
      name: mariadb-server
      state: present
   - name: Present php version installed
     ansible.builtin.dnf:
      name: php
      state: present
   - name: Present php-mysqlnd version installed
     ansible.builtin.dnf:
      name: php-mysqlnd
      state: present
   - name: Firewalld is enable and ruuning
     ansible.builtin.service:
      name: firewalld
      enabled: true
      state: started
   - name: Ensure HTTP traffic is allowed
     ansible.posix.firewalld:
      service: http
      permanent: true
      state: enabled
      immediate: true
   # reloaded, restarted, started, stopped.
   - name: HTTPD is enable and ruuning
     ansible.builtin.service:
      name: httpd
      enabled: true
      state: started
   - name: Mariadb-server is enable and started
     ansible.builtin.service:
      name: mariadb
      enabled: true
      state: started
   - name: Download index.php
     ansible.builtin.get_url:
      url: http://materials.example.com/labs/playbook-review/index.php
      dest: /var/www/html/
      mode: '0644'

- name: Check web server
  hosts: localhost
  tasks:
   - name: Test web service on serverb
     ansible.builtin.uri:
      url: http://serverb.lab.example.com
      status_code: 200
